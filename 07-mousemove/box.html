<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>박스 움직이기</title>
        <style>
            #box {
                /* w50+h50+bg#f55+posa+t0 */
                width: 50px;
                height: 50px;
                background: #f55;
                position: absolute;
                top: 0;
            }
        </style>
    </head>
    <body>
        <div id="box"></div>

        <script>
            const box = document.querySelector("#box");
            let position = 0;

            function Animate() {
                position += 2; // position = position + 2;
                box.style.top = position + "px";

                // 박스 브라우저 바닥에 닿지 않았다면
                if (position < window.innerHeight - 50) {
                    // setTimeout(동작 ,시간)
                    // setTimeout(Animate, 1000 / 60); // 1000/60 --> 1초에 60번
                    requestAnimationFrame(Animate);
                }
            }
            Animate();
        </script>
    </body>
</html>
